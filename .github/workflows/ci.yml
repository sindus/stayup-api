name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stayup_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # Un moteur SQL qui n'est pas Postgres, et un moteur NoSQL : la suite de
      # conformité ne prouve quelque chose que si elle tourne sur les trois.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      # Chaque adaptateur doit satisfaire le même contrat, sinon « l'API s'adapte
      # au type de base » n'est qu'une promesse. Celui-ci tourne sur un vrai SQLite.
      - name: Run adapter conformance suite
        run: npm run test:conformance

      # Les fonctionnels couvrent l'API sur Postgres, et la conformité des
      # adaptateurs MySQL et MongoDB sur de vrais serveurs.
      - name: Run functional tests
        run: npm run test:functional
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: stayup_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MONGO_HOST: localhost
          MONGO_PORT: 27017

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
