name = "stayup-api"
main = "src/app.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put`):
#   DATABASE_URL  — e.g. postgres://user:pass@host/dbname
#   JWT_SECRET    — JWT signing key
# Administrators live in the database: bootstrap the first super admin with
# `npm run create-admin <email> <name> <password>`.

[observability]
enabled = true
